name: Package Release

on:
  push:
    branches:
      - release-5node-xhttp-cloudflare-v3-2026-08-24
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release source
        run: |
          set -eu
          test ! -e RELEASE-MANIFEST.json
          grep -q 'BUILD_ID=fix-5node-xhttp-cloudflare-v3' Dockerfile
          grep -q 'type":"xhttp"' scripts/generate.py
          ! grep -q 'cloudflare-ws-tls' scripts/generate.py
          ! grep -q 'type":"ws"' scripts/generate.py
          grep -q '127.0.0.1", 10087' scripts/gateway.py
          grep -q '127.0.0.1", 10088' scripts/gateway.py
          grep -q '127.0.0.1", 10089' scripts/gateway.py
          python3 -m py_compile scripts/*.py
      - name: Create release archive
        run: |
          set -eu
          mkdir -p dist
          git archive --format=zip --output=dist/railway-four-node-34-release-5node-xhttp-cloudflare-v3-2026-08-24.zip HEAD
          sha256sum dist/railway-four-node-34-release-5node-xhttp-cloudflare-v3-2026-08-24.zip | tee dist/SHA256SUMS.txt
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: railway-four-node-34-release-5node-xhttp-cloudflare-v3-2026-08-24
          path: dist/
          if-no-files-found: error
