name: Package Release

on:
  push:
    branches:
      - fix-5node-lifecycle-2026-08-24
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release archive
        run: |
          set -eu
          mkdir -p dist
          git archive --format=zip --output=dist/railway-four-node-34-fix-5node-lifecycle-2026-08-24.zip HEAD
          sha256sum dist/railway-four-node-34-fix-5node-lifecycle-2026-08-24.zip | tee dist/SHA256SUMS.txt
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: railway-four-node-34-fix-5node-lifecycle-2026-08-24
          path: dist/
          if-no-files-found: error
